let motion=null,readObserver=null;
function mountMotion(){if(window.ScrollCraft && window.matchMedia && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){try{motion=ScrollCraft.mount(main)}catch(e){/* motion must never block the course */}}}
function readingRail(l){return '<nav class="step-rail" aria-label="Étapes de la leçon">'+l.blocks.map((b,i)=>'<button type="button" data-step="'+i+'">'+({clair:'En clair',analogie:'Analogie',comment:'Méthode',exemple:'Exemple',pourquoi:'Utilité',exo:'Exercice',schema:'Schéma'}[b.t]||b.h)+'</button>').join('')+'<button type="button" data-step="'+l.blocks.length+'">Mes mots</button><div class="steps-meter" aria-hidden="true"><i></i></div></nav>'}
function enhanceReading(){const rail=main.querySelector('.step-rail');if(!rail)return;const blocks=[...main.querySelectorAll('.block'),main.querySelector('#reformSection')],buttons=[...rail.querySelectorAll('button')];let active=0;function setActive(i){active=i;buttons.forEach((b,n)=>{b.classList.toggle('active',i===n);if(i===n)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});rail.querySelector('.steps-meter i').style.transform='scaleX('+((i+1)/blocks.length)+')'}blocks.forEach((b,i)=>{b.id='reading-step-'+i;buttons[i].onclick=()=>{b.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});setActive(i)}});if('IntersectionObserver' in window){readObserver=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting);if(visible.length){const first=visible.sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];setActive(blocks.indexOf(first.target))}},{rootMargin:'-130px 0px -45% 0px',threshold:0});blocks.forEach(b=>readObserver.observe(b))}setActive(active)}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a&&a.getAttribute('href')===location.hash){e.preventDefault();route();main.focus({preventScroll:true})}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.side').classList.contains('open')){document.querySelector('.side').classList.remove('open');document.getElementById('menuBtn').setAttribute('aria-expanded','false');document.getElementById('menuBtn').focus()}});
function route(){if(motion)motion.destroy();motion=null;if(readObserver)readObserver.disconnect();if(request){request.abort();request=null}const [view,a,b]=location.hash.slice(1).split('/');let q='';try{q=decodeURIComponent(a||'')}catch{}if(view==='lesson')lesson(a,b);else if(view==='section')section(a);else if(view==='notes')notes();else if(view==='search')search(q);else home();renderNav();document.getElementById('searchInput').value=view==='search'?q:'';document.querySelector('.side').classList.remove('open');document.getElementById('menuBtn').setAttribute('aria-expanded','false');document.title=(main.querySelector('h1')?.textContent||'Apprendre')+' · Ma Base';window.scrollTo(0,0);enhanceReading();mountMotion()}
document.querySelector('.skip').onclick=e=>{e.preventDefault();main.focus();main.scrollIntoView?.()};
window.addEventListener('hashchange',()=>{route();main.focus({preventScroll:true})});
document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();location.hash='search/'+encodeURIComponent(document.getElementById('searchInput').value.trim())};
document.getElementById('menuBtn').onclick=e=>{const open=document.querySelector('.side').classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',open);if(open)document.querySelector('.side a').focus()};
document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'mabase',version:1,exportedAt:new Date().toISOString(),progress},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mabase-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Sauvegarde exportée : progression et reformulations.')};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5000000)throw Error('Fichier trop volumineux');const data=JSON.parse(await f.text());if(data.app!=='mabase'||data.version!==1)throw Error('Ce fichier n’est pas une sauvegarde Ma Base compatible');const restored=clean(data.progress);if(!Object.keys(restored).length)throw Error('Cette sauvegarde est vide');if(!confirm('Importer cette sauvegarde ? Les notes et statuts présents dans le fichier remplaceront les versions correspondantes dans ce navigateur. Les autres seront conservés.'))return;progress={...progress,...restored};storageCorrupt=false;const saved=save();route();notify(saved?'Sauvegarde importée.':'Importée en mémoire seulement : stockage indisponible.')}catch(err){notify('Import impossible : '+err.message)}finally{e.target.value=''}};
route();if(storageIssue)notify('Le stockage local est indisponible ou illisible. Exporte tes notes pour les conserver.');
</script></body></html>
