      {t:"exo", h:"À toi de jouer", c:"Reprends une question que tu as déjà posée à une IA et qui t'a déçu. Reformule-la avec la formule Rôle+Contexte+Tâche+Format+Contrainte. Compare la qualité de la réponse. Note la différence."}
    ]}
   ]},

  {id:"auto", name:"Automatisation", emoji:"⚙️", intro:
    "Une automatisation = enlever les tâches répétitives à ta place. C'est aussi un business (Agentia). On comprend les briques avant de toucher aux outils.",
   lessons:[
    {id:"auto-quoi", title:"C'est quoi une automatisation ?", minutes:4, blocks:[
      {t:"clair", h:"En clair", c:"Une automatisation = un enchaînement d'actions que la machine exécute toute seule, déclenché par un événement, sans que tu aies à le refaire à la main à chaque fois."},
      {t:"analogie", h:"L'image dans la tête", c:"C'est le principe du domino : tu pousses le premier (le déclencheur), et tous les autres tombent tout seuls dans l'ordre que tu as choisi (les actions). Toi, tu n'as fait que pousser le premier."},
      {t:"comment", h:"Les 3 briques", c:"<b>1. Déclencheur</b> — « quand il se passe X » (un email arrive, une heure sonne, un formulaire est rempli). <b>2. Actions</b> — « alors fais Y, puis Z » (copier, envoyer, noter, lancer un script). <b>3. Condition</b> — « mais seulement si… » (si l'email contient « devis », alors…). C'est tout. Les gros outils (n8n, Make, Zapier) ne sont que des assembleurs de ces 3 briques."},
      {t:"pourquoi", h:"Pourquoi ça te sert", c:"C'est à la fois ton futur métier (les entreprises paient pour qu'on leur retire les tâches répétitives) et un gain de temps perso. Et ça te rend meilleur en cyber : comprendre comment un système s'enchaîne, c'est comprendre où ça peut casser."},
      {t:"exo", h:"À toi de jouer", c:"Trouve UNE tâche répétitive que tu fais chaque semaine (même perso : trier des mails, noter quelque chose). Écris-la en 3 lignes : déclencheur / actions / condition. Félicitations, tu viens de « concevoir » une automatisation."}
    ]},
    {id:"auto-exemple", title:"Un vrai exemple de bout en bout", minutes:6, blocks:[
      {t:"clair", h:"En clair", c:"On va voir une automatisation réelle : « quand un email arrive avec « devis » dans l'objet, copier le contenu dans une feuille de calcul et m'envoyer une alerte ». Ça se construit en 15 minutes avec n8n ou Make, sans écrire une ligne de code."},
      {t:"analogie", h:"L'image dans la tête", c:"C'est comme un assistant invisible qui surveille ta boîte mail 24h/24 : dès qu'un devis arrive, il le recopie proprement dans ton tableau ET t'envoie un SMS pour te prévenir. Toi, tu n'ouvres plus jamais ta boîte pour chercher les devis."},
      {t:"comment", h:"Le schéma", c:"<b>Déclencheur</b> : « nouvel email reçu » (le serveur mail prévient l'outil). <b>Condition</b> : « l'objet contient « devis » ». <b>Action 1</b> : écrire une ligne dans Google Sheets (expéditeur, sujet, date). <b>Action 2</b> : envoyer une notification. L'outil enchaîne ces briques à chaque email. Si tu branches une IA au milieu, elle peut même rédiger une réponse au devis — et là tu tiens le workflow qu'on teste côté Agentia."},
      {t:"exemple", h:"Le résultat", c:"Avant : tu passes 20 min/jour à trier les devis, tu en rates parfois. Après : le tableau se remplit seul, tu reçois une alerte, tu ne rates plus rien. C'est la valeur que les entreprises achètent."},
      {t:"pourquoi", h:"Pourquoi ça te sert", c:"C'est exactement l'offre que tu es en train de valider pour Agentia. Et même pour toi : tes veilles, tes rapports, tes relances — tout ce que tu fais à la main plusieurs fois peut être automatisé."},
      {t:"exo", h:"À toi de jouer", c:"Décris avec tes mots, en 4 étapes maximum, une automatisation qui te ferait gagner du temps cette semaine. Puis note : quel est le déclencheur ? la condition ? les actions ? C'est le plan d'une vraie automatisation."}
    ]}
   ]},

  {id:"code", name:"Code", emoji:"💻", intro:
    "Tu veux apprendre à LIRE le code que l'IA t'écrit, pas forcément devenir développeur. C'est exactement le bon objectif : lire, comprendre, vérifier. On y va.",
   lessons:[
    {id:"code-lire", title:"Lire du code sans être développeur", minutes:5, blocks:[
      {t:"clair", h:"En clair", c:"Lire du code, c'est 90 % du chemin pour ne plus dépendre aveuglément d'une IA. Un programme, c'est une recette écrite pas à pas — si tu sais lire les étapes, tu sais ce qu'il fait."},
      {t:"analogie", h:"L'image dans la tête", c:"Un script = une recette de cuisine. Chaque ligne = une instruction : « prends 2 œufs », « mélange », « si c'est trop sec, ajoute du lait ». Lire du code, c'est lire la recette avant de l'exécuter — pour savoir si elle va donner un gâteau ou une catastrophe."},
      {t:"comment", h:"Comment lire", c:"Ne lis pas de haut en bas en paniquant. Repère : <b>1. Les variables</b> (les boîtes qui contiennent des valeurs). <b>2. Les conditions</b> (les « si… alors… »). <b>3. Les boucles</b> (les « répète tant que… »). <b>4. Les fonctions</b> (les blocs réutilisables avec un nom). <b>5. Les entrées/sorties</b> (ce qui entre, ce qui sort). 90 % du code du monde n'utilise que ces 5 idées."},
      {t:"pourquoi", h:"Pourquoi ça te sert", c:"Quand une IA t'écrit un script, tu pourras : vérifier qu'il ne fait pas n'importe quoi (surtout en cyber, où un script peut être dangereux), le corriger, et demander des changements précis au lieu de « ça marche pas »."},
      {t:"exo", h:"À toi de jouer", c:"Ne touche à rien d'autre pour l'instant. Garde juste en tête les 5 briques : variable, condition, boucle, fonction, entrée/sortie. La prochaine leçon les détaille une par une."}
    ]},
    {id:"code-briques", title:"Les 5 briques de base, une par une", minutes:8, blocks:[
      {t:"clair", h:"En clair", c:"Presque tout le code repose sur 5 idées simples. Si tu les reconnais, tu peux lire n'importe quel script en te demandant simplement « laquelle des 5 c'est ? »."},
      {t:"analogie", h:"Les 5 briques = les 5 outils d'une boîte", c:"<b>Variable</b> = une boîte étiquetée où tu ranges une valeur. <b>Condition</b> = un aiguillage « si… alors… sinon… ». <b>Boucle</b> = un tourniquet « répète ceci ». <b>Fonction</b> = un sous-programme avec un nom, que tu appelles quand tu veux. <b>Entrée/sortie</b> = ce que le programme reçoit (input) et rend (print/return)."},
      {t:"comment", h:"En Python, ça ressemble à ça", c:"", code:[
        ["# 1. VARIABLE : une boîte qui range une valeur", "age = 21"],
        ["# 2. CONDITION : un aiguillage", "if age >= 18:", "    print(\"majeur\")", "else:", "    print(\"mineur\")"],
        ["# 3. BOUCLE : répéter", "for i in range(3):", "    print(i)   # affiche 0, 1, 2"],
        ["# 4. FONCTION : un bloc nommé, réutilisable", "def dire_bonjour(nom):", "    print(\"Bonjour\", nom)"],
        ["# 5. ENTREE/SORTIE", "prenom = input(\"Ton prénom ? \")  # entre", "dire_bonjour(prenom)              # sort"],
      ]},
      {t:"exemple", h:"Lis ce mini-script", c:"<code>def doubler(n): return n * 2</code> puis <code>print(doubler(5))</code>. Lis-le : « doubler » est une fonction (brique 4) qui prend une valeur n et la rend doublée. Ensuite on l'appelle avec 5, donc on affiche 10. Tu viens de lire du code."},
      {t:"pourquoi", h:"Pourquoi ça te sert", c:"Les scripts que l'IA t'écrira (scanner un réseau, automatiser une tâche) ne sont QUE des combinaisons de ces 5 briques. Reconnaître les briques = comprendre le script, même sans tout connaître."},
      {t:"exo", h:"À toi de jouer", c:"Reprends les 5 briques et écris (sur papier ou dans ta tête) ce que fait : <code>for mot in [\"pomme\", \"poire\"]: print(mot)</code>. Si tu dis « ça affiche pomme puis poire », tu as compris la boucle."}
    ]},
    {id:"code-lire-script", title:"Lire un vrai script que l'IA t'a donné", minutes:6, blocks:[
      {t:"clair", h:"En clair", c:"On prend un vrai petit script utile (en cyber : vérifier si un site répond) et on le lit ligne par ligne. C'est exactement le réflexe que tu veux avoir avec une IA."},
      {t:"comment", h:"Le script, puis sa lecture", c:"", code:[
        ["import requests", "", "def site_en_ligne(url):", "    try:", "        r = requests.get(url, timeout=5)", "        return f\"OK ({r.status_code})\"", "    except Exception as e:", "        return f\"Injoignable : {e}\"", "", "print(site_en_ligne(\"https://example.com\"))"]]
      },
      {t:"exemple", h:"Lecture ligne par ligne", c:"<code>import requests</code> → on charge une bibliothèque qui sait parler HTTP (la langue des sites, tu l'as vue en cyber). <code>def site_en_ligne(url):</code> → on définit une fonction nommée qui prend une adresse. <code>try:</code> → « essaie ceci ». <code>r = requests.get(url)</code> → envoie une requête et range la réponse. <code>return f« OK (...) »</code> → si ça marche, rend « OK + code ». <code>except:</code> → « si ça plante, au lieu de planter ». <code>print(...)</code> → affiche le résultat. Tu viens de lire un script entier."},
      {t:"pourquoi", h:"Pourquoi ça te sert", c:"Ce script est le genre de chose qu'une IA t'écrit en 5 secondes. Maintenant, tu peux le lire, deviner ce qu'il fait, et même repérer qu'il ne teste qu'un seul site (tu saurais le modifier pour en tester plusieurs avec une boucle — brique 3)."},
      {t:"exo", h:"À toi de jouer", c:"Demande à une IA : « écris un script Python qui vérifie si un site répond, explique chaque ligne en français simple ». Puis lis-le toi-même D'ABORD, et compare ton explication avec la sienne. Où vous divergez, c'est ta prochaine chose à comprendre."}
    ]}
   ]}
];
</script>

<script>
// ============================================================
//  MOTEUR DE L'APPLI (ne pas toucher pour ajouter du contenu)
// ============================================================
const LS = "mabase-progress-v1";
const TRACK = {methode:"#3ddad7", tsrs:"#e6c66b", parcours:"#7cb8ff", pentest:"#ff6b6b", bloc1:"#5ad1ff", bloc2:"#41c8b8", bloc3:"#ffb454", bloc4:"#7ade6a", bloc5:"#ff9ac1", ia:"#b08bff", auto:"#ffa94d", code:"#b5e655"};
function colorOf(id){ return TRACK[id] || "#3ddad7"; }
let progress = {};
try { progress = JSON.parse(localStorage.getItem(LS) || "{}"); } catch(e){ progress = {}; }
function save(){ localStorage.setItem(LS, JSON.stringify(progress)); renderProg(); }

const nav = document.getElementById("nav");
const main = document.getElementById("main");
let currentSection = null, currentLesson = null;

function allLessons(){ return SECTIONS.flatMap(s => s.lessons); }

const flatLessons = SECTIONS.flatMap(s => s.lessons.map(l => ({...l, sid:s.id, section:s.name})));
const LESSON_IDS = new Set(flatLessons.map(l => l.id));
function stripHtml(s){ const d = document.createElement("div"); d.innerHTML = s||""; return d.textContent||""; }
function normalize(s){ return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }
const searchIndex = new Map(flatLessons.map(l => [l.id, normalize(l.title+" "+l.section+" "+l.blocks.map(b => stripHtml(b.c)+" "+b.h+" "+(b.code||[]).flat().join(" ")).join(" "))]));
let toastTimer = null;
function notify(s){ const t = document.getElementById("toast"); if(!t) return; t.textContent = s; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.textContent = ""; }, 5000); }
function clean(data){ if(!data || typeof data!=="object" || Array.isArray(data)) throw Error("Format invalide"); const out = {}; for(const [k,v] of Object.entries(data)){ if(LESSON_IDS.has(k) && typeof v==="boolean") out[k]=v; else if(k.startsWith("reform:") && LESSON_IDS.has(k.slice(7)) && typeof v==="string" && v.length<=100000) out[k]=v; } return out; }

function renderProg(){
  const total = allLessons().length;
  const done = allLessons().filter(l => progress[l.id]).length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById("progBar").style.width = pct + "%";
  document.getElementById("progPct").textContent = pct + "% (" + done + "/" + total + ")";
}

function renderNav(){
  nav.innerHTML = "";
  SECTIONS.forEach(s => {
    const done = s.lessons.filter(l => progress[l.id]).length;
    const el = document.createElement("div");
    el.className = "nav-item" + (currentSection === s.id ? " active" : "");
    el.style.setProperty("--tc", colorOf(s.id));
    el.innerHTML = `<span class="ic">${s.emoji}</span><span class="lbl">${s.name}</span><span class="cnt">${done}/${s.lessons.length}</span>`;
    el.onclick = () => { currentSection = s.id; currentLesson = null; renderNav(); renderSection(); };
    nav.appendChild(el);
  });
}

function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderBlocks(lesson){
  let html = "";
  (lesson.blocks||[]).forEach(b => {
    const icons = {clair:"💡", analogie:"🧠", comment:"🔧", exemple:"🧪", pourquoi:"🎯", exo:"✏️", schema:"🕸️"};
    if (b.t === "schema"){
      html += `<div class="block b-schema"><div class="tag">🕸️ ${b.h}</div>`;
      if (b.c) html += `<p>${b.c}</p>`;
      html += `<div class="schema">`;
      (b.boxes||[]).forEach((n,i) => {
        if (i>0 && b.arrows !== false) html += `<span class="arrow">→</span>`;
        html += `<div class="node${n.hot ? " hot" : ""}"><b>${escapeHtml(n.l)}</b>${n.s ? `<span>${escapeHtml(n.s)}</span>` : ""}</div>`;
      });
      html += `</div>`;
      if (b.note) html += `<div class="schema-note">${escapeHtml(b.note)}</div>`;
      html += `</div>`;
      return;
    }
    html += `<div class="block b-${b.t}"><div class="tag">${icons[b.t]||""} ${b.h}</div>`;
    html += `<p>${b.c}</p>`;
    if (b.code){ html += "<pre>" + b.code.map(line => {
      const l = line[0];
      let cls = "";
      if(/^\s*#/.test(l)) cls = "cm";
      return `<span class="${cls}">${escapeHtml(l)}</span>`;
    }).join("\n") + "</pre>"; }
    html += `</div>`;
  });
  return html;
}

function renderSection(){
  const s = SECTIONS.find(x => x.id === currentSection);
  const tc = colorOf(s.id);
  const doneCount = s.lessons.filter(l => progress[l.id]).length;
  const totalMin = s.lessons.reduce((a,l) => a + (l.minutes||0), 0);
  const totalSteps = s.lessons.reduce((a,l) => a + (l.blocks||[]).length, 0);
  let html = `<div style="--tc:${tc}">`;
  html += `<div class="crumb"><span class="dot"></span>${s.emoji} ${s.name}</div><h1>${s.name}</h1>`;
  html += `<div class="stats">
    <div class="stat"><span class="k">Compris</span><b>${doneCount}/${s.lessons.length}</b><span class="v">leçons</span></div>
    <div class="stat"><span class="k">Temps</span><b>${totalMin} min</b><span class="v">de lecture</span></div>
    <div class="stat"><span class="k">Étapes</span><b>${totalSteps}</b><span class="v">à comprendre</span></div>
  </div>`;
  html += `<div class="intro">${s.intro}</div><div class="lessons">`;
  s.lessons.forEach((l, idx) => {
    const done = progress[l.id];
    const num = String(idx+1).padStart(2, "0");
    html += `<div class="lesson-card${done ? " is-done" : ""}" onclick="openLesson('${s.id}','${l.id}')">
      <div class="em">${done ? "✓" : num}</div>
      <div style="flex:1;min-width:0"><div class="t">${escapeHtml(l.title)}</div>
      <div class="d">${l.minutes} min · ${l.blocks.length} étapes</div></div>
      <div class="st">${done ? '<span class="done-pill">Compris</span>' : '<span class="go">→</span>'}</div></div>`;
  });
  html += `</div>`;
  const next = s.lessons.find(l => !progress[l.id]);
  if (next){
    html += `<div class="nextup"><span class="nextup-label">Suite</span><div class="nextup-body"><span class="nextup-title">${escapeHtml(next.title)}</span><span class="nextup-meta">${next.minutes} min · ${next.blocks.length} étapes</span></div><button class="nextup-btn" onclick="openLesson('${s.id}','${next.id}')">Continuer →</button></div>`;
  } else {
    html += `<div class="nextup"><span class="nextup-label">Terminé</span><div class="nextup-body"><span class="nextup-title">Parcours terminé 🎉</span><span class="nextup-meta">Passe au parcours suivant dans la barre de gauche.</span></div></div>`;
  }
  html += `</div>`;
  main.innerHTML = html;
}

function openLesson(sid, lid){
  currentSection = sid; currentLesson = lid;
  renderNav();
  const l = SECTIONS.find(x=>x.id===sid).lessons.find(x=>x.id===lid);
  const tc = colorOf(sid);
  let html = `<div style="--tc:${tc}">`;
  html += `<div class="back" onclick="backToSection()">← Retour</div>`;
  html += `<div class="crumb"><span class="dot"></span>📖 Leçon</div><h1>${escapeHtml(l.title)}</h1>`;
  html += `<div class="meta"><span class="pill">${l.minutes} min</span><span class="pill">${l.blocks.length} étapes</span></div>`;
  html += renderBlocks(l);
  const done = progress[lid];
  html += `<button class="done-btn ${done?"is-done":""}" id="doneBtn" onclick="toggleDone('${sid}','${lid}')">${done ? "✓ Compris" : "Marquer comme compris"}</button>`;
  html += `<div class="reform"><label>🧠 Reformule avec tes mots — ta preuve</label>
    <textarea id="reformBox" placeholder="Explique cette leçon comme à quelqu'un qui n'y connaît rien. Le mot sur lequel tu bloques, c'est exactement ce qu'il faut relire.">${escapeHtml(progress["reform:"+lid] || "")}</textarea>
    <button class="tutor-btn" id="tutorBtn" onclick="corriger('${sid}','${lid}')">🤖 Corrige ma reformulation (IA locale)</button>
    <div class="tutor-out" id="tutorOut" style="display:none"></div>
    <div class="hint">Méthode Feynman : si tu peux l'expliquer simplement, tu l'as comprise. Le bouton 🤖 fait corriger ta reformulation par une IA qui tourne sur ton Mac — privé, hors ligne, rien ne sort de ton poste.</div></div></div>`;
  main.innerHTML = html;
  const rb = document.getElementById("reformBox");
  if (rb){ rb.addEventListener("input", function(){ progress["reform:"+lid] = rb.value; localStorage.setItem(LS, JSON.stringify(progress)); }); }
  window.scrollTo(0,0);
}

function backToSection(){ currentLesson = null; renderNav(); renderSection(); window.scrollTo(0,0); }
function toggleDone(sid, lid){
  progress[lid] = !progress[lid];
  save(); renderNav();
  const btn = document.getElementById("doneBtn");
  if(btn){ btn.textContent = progress[lid] ? "✓ Compris" : "Marquer comme compris"; btn.classList.toggle("is-done", !!progress[lid]); }
}

// tuteur IA : corrige la reformulation de l'élève via le modèle local (llama.cpp sur 127.0.0.1:8080)
async function corriger(sid, lid){
  const l = SECTIONS.find(x=>x.id===sid).lessons.find(x=>x.id===lid);
  const ta = document.getElementById("reformBox");
  const btn = document.getElementById("tutorBtn");
  const out = document.getElementById("tutorOut");
  const txt = (ta ? ta.value : "").trim();
  if(!txt){
    out.style.display = "block";
    out.innerHTML = `<div class="tutor-msg">✍️ Écris d'abord ta reformulation ci-dessus, puis relance la correction.</div>`;
    return;
  }
  const strip = s => (s||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
  const ref = (l.blocks||[]).filter(b=>b.t==="clair"||b.t==="comment").map(b=>strip(b.c)).join(" ").slice(0,1400);
  const prompt = "Tu es un tuteur TSRS (informatique, réseaux, sécurité), bienveillant mais exigeant.\nLEÇON : « "+l.title+" »\nLe point clé à maîtriser : "+ref+"\nL'élève reformule avec ses mots : « "+txt+" »\nCorrige-le en français simple et court :\n1) ✅ Ce qui est juste (1 phrase)\n2) ❌ Ce qui manque ou est faux (1-2 phrases)\n3) ❓ Une question pour vérifier qu'il a vraiment compris (1 question)\nMaximum 6 phrases au total, sans jargon.";
  btn.disabled = true; btn.textContent = "🤖 L'IA réfléchit…";
  out.style.display = "block";
  out.innerHTML = `<div class="tutor-msg tutor-load">Le modèle local réfléchit (10–20 s)…</div>`;
  try{
    const r = await fetch("http://127.0.0.1:8080/v1/chat/completions", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({messages:[{role:"user",content:prompt}], max_tokens:320, temperature:0.3})
    });
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    const answer = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "";
    out.innerHTML = `<div class="tutor-msg tutor-ok">${escapeHtml(answer).replace(/\n/g,"<br>")}</div>`;
  }catch(e){
    out.innerHTML = `<div class="tutor-msg tutor-err">⚠️ IA locale injoignable. Ouvre Terminal et tape <code>~/.hermes/local-ai/demarrer.sh</code>, attends « Moteur prêt », puis réessaie. (Détail : ${escapeHtml(String(e))})</div>`;
  } finally {
    btn.disabled = false; btn.textContent = "🤖 Corrige ma reformulation (IA locale)";
  }
}

// recherche
function searchCard(l){
  const tc = colorOf(l.sid);
  return `<div class="lesson-card${progress[l.id] ? " is-done" : ""}" style="--tc:${tc}" onclick="openLesson('${l.sid}','${l.id}')">
    <div class="em">${progress[l.id] ? "✓" : "🔍"}</div>
    <div style="flex:1;min-width:0"><div class="t">${escapeHtml(l.title)}</div>
    <div class="d">${escapeHtml(l.section)} · ${l.minutes} min</div></div>
    <div class="st">${progress[l.id] ? '<span class="done-pill">Compris</span>' : '<span class="go">→</span>'}</div></div>`;
}
function renderSearch(q){
  main.innerHTML = `<div style="--tc:#3ddad7"><div class="crumb"><span class="dot"></span>Recherche</div><h1>Recherche</h1>
    <p class="lead" id="resultCount" role="status"></p>
    <div class="filters"><label style="font-size:13px;color:var(--ink2)">Statut <select id="statusFilter" style="margin-left:8px"><option value="all">Toutes les leçons</option><option value="todo">À comprendre</option><option value="done">Comprises</option></select></label></div>
    <div class="lessons" id="results" style="margin-top:16px"></div></div>`;
  function update(){
    const status = document.getElementById("statusFilter").value;
    const words = normalize(q).trim().split(/\s+/).filter(Boolean);
    const found = flatLessons.filter(l => words.every(w => searchIndex.get(l.id).includes(w)) && (status==="all" || (status==="done" ? !!progress[l.id] : !progress[l.id])));
    document.getElementById("resultCount").textContent = found.length + " résultat" + (found.length>1 ? "s" : "") + (q.trim() ? " pour « "+q.trim()+" »" : "");
    document.getElementById("results").innerHTML = found.length ? found.map(searchCard).join("") : `<div class="empty" style="color:var(--ink2)">Aucune leçon trouvée. Essaie un autre mot ou change le filtre.</div>`;
  }
  document.getElementById("statusFilter").onchange = update;
  update();
}
function submitSearch(e){
  e.preventDefault();
  renderSearch(document.getElementById("searchInput").value || "");
  return false;
}

// export / import de la progression
function exportData(){
  const blob = new Blob([JSON.stringify({app:"mabase", version:1, exportedAt:new Date().toISOString(), progress}, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "mabase-sauvegarde-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  notify("Sauvegarde exportée : progression et reformulations.");
}
function importData(file){
  if(!file) return;
  if(file.size > 5000000){ notify("Fichier trop volumineux."); return; }
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const data = JSON.parse(reader.result);
      if(data.app!=="mabase" || data.version!==1) throw Error("Ce fichier n'est pas une sauvegarde Ma Base compatible");
      const restored = clean(data.progress);
      if(!Object.keys(restored).length) throw Error("Cette sauvegarde est vide");
      if(!confirm("Importer cette sauvegarde ? Les notes et statuts du fichier remplaceront les versions correspondantes. Les autres seront conservés.")) return;
      progress = {...progress, ...restored};
      save(); renderNav(); renderProg();
      notify("Sauvegarde importée.");
    }catch(err){ notify("Import impossible : "+err.message); }
  };
  reader.readAsText(file);
}

// menu mobile
function toggleMenu(btn){
  const side = document.getElementById("side");
  const open = side.classList.toggle("open");
  btn.setAttribute("aria-expanded", open);
}

// démarrage
currentSection = SECTIONS[0].id;
renderNav(); renderSection(); renderProg();
</script>
